<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>INBA | Comercialización Productiva de Imbabura</title>
<style>
:root{--navy:#123b63;--green:#238653;--orange:#e9782c;--purple:#6843a8;--ink:#203449;--muted:#718096;--line:#e3eaf0;--bg:#f4f7fa}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px/1.5 Inter,system-ui,sans-serif;color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer}.shell{min-height:100vh;display:grid;grid-template-columns:235px 1fr}.side{background:var(--navy);color:white;padding:22px 15px;display:flex;flex-direction:column;gap:22px}.logo{display:flex;align-items:center;gap:10px;padding:0 8px}.mark{width:42px;height:42px;border-radius:12px;background:#fff;color:var(--green);display:grid;place-items:center;font-size:24px;font-weight:900}.logo b{font-size:22px;letter-spacing:1.5px}.logo small{display:block;color:#c5d8e7;font-size:9px}.navlabel{font-size:10px;letter-spacing:1.3px;color:#a8c0d2;padding:0 10px}.nav{display:grid;gap:5px}.nav button{border:0;border-radius:9px;background:transparent;color:#e5eef5;text-align:left;padding:11px}.nav button:hover,.nav button.active{background:#28577d}.sidefoot{margin-top:auto;border-top:1px solid #42627d;padding:14px 8px;color:#c5d8e7;font-size:11px}.main{min-width:0}.top{height:66px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px}.top span{color:var(--muted);font-size:12px}.avatar{width:34px;height:34px;border-radius:50%;background:#e5f2e9;color:var(--green);display:grid;place-items:center;font-weight:800}.content{padding:27px;max-width:1400px;margin:auto}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:20px}.eyebrow{font-size:10px;color:var(--green);font-weight:800;letter-spacing:1.2px;text-transform:uppercase}.head h1{font-size:25px;color:var(--navy);margin:4px 0}.sub{color:var(--muted);font-size:13px}.btn{background:var(--green);color:white;border:0;border-radius:8px;padding:10px 14px;font-weight:700}.btn.alt{background:white;color:var(--navy);border:1px solid var(--line)}.btn.sm{padding:7px 10px;font-size:11px}.hero{background:linear-gradient(110deg,#123b63,#205783);border-radius:15px;padding:28px;color:white;display:grid;grid-template-columns:1.2fr .8fr;gap:15px;align-items:center}.hero h2{font-size:27px;line-height:1.18;margin:8px 0}.hero p{color:#d8e7f1}.heroart{background:linear-gradient(135deg,#d9eddf,#f2f5e9);height:160px;border-radius:12px;display:grid;place-items:center;font-size:70px}.tiles,.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:17px 0}.tile,.card{background:white;border:1px solid var(--line);border-radius:12px;padding:16px}.tile{display:flex;gap:12px;align-items:center}.tile i{font-style:normal;font-size:25px}.tile b{display:block;color:var(--navy);font-size:13px}.tile small{color:var(--muted);font-size:11px}.section{margin:20px 0}.secthead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.secthead h2{font-size:17px;color:var(--navy);margin:0}.categories{display:grid;grid-template-columns:repeat(8,1fr);gap:9px}.cat{background:white;border:1px solid var(--line);border-radius:10px;text-align:center;padding:12px 5px;cursor:pointer}.cat i{font-style:normal;font-size:25px;display:block}.cat b{font-size:10px}.actors{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.actor{background:white;border:1px solid var(--line);border-radius:12px;padding:15px;display:flex;gap:12px}.actor i{font-style:normal;font-size:26px}.actor h3{font-size:13px;color:var(--navy);margin:0 0 5px}.actor p{font-size:11px;color:var(--muted);margin:0 0 8px}.gridproducts{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.product{padding:0;overflow:hidden}.art{height:115px;background:#eaf4ec;display:grid;place-items:center;font-size:52px}.pbody{padding:13px}.pbody h3{margin:0;color:var(--navy);font-size:14px}.pbody p{margin:4px 0;color:var(--muted);font-size:11px}.price{color:var(--green);font-size:18px;font-weight:800}.toolbar{display:flex;gap:9px;margin:14px 0;flex-wrap:wrap}.field{border:1px solid var(--line);background:white;border-radius:8px;padding:9px 11px;min-width:160px}.field.search{flex:1}.tablewrap{overflow:auto;background:white;border:1px solid var(--line);border-radius:12px;padding:10px}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;color:#82909d;font-size:10px;text-transform:uppercase;padding:11px;border-bottom:1px solid var(--line)}td{padding:12px 11px;border-bottom:1px solid #edf1f4;font-size:12px}.pill{background:#e8f4ed;color:#27794b;border-radius:20px;padding:4px 8px;font-size:10px;font-weight:700}.pill.warn{background:#fff1df;color:#a76a19}.pill.blue{background:#eaf2f9;color:#39739e}.stat small{color:var(--muted)}.stat strong{display:block;font-size:25px;color:var(--navy);margin:5px 0}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fg{display:grid;gap:5px}.fg label{font-size:11px;font-weight:700}.fg input,.fg select{padding:10px;border:1px solid var(--line);border-radius:8px}.modal{display:none;position:fixed;inset:0;background:#0e2c477c;align-items:center;justify-content:center;padding:15px;z-index:8}.modal.open{display:flex}.dialog{background:white;border-radius:14px;padding:22px;width:min(540px,100%)}.dialog h2{margin:0 0 16px;color:var(--navy)}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.toast{display:none;position:fixed;bottom:20px;right:20px;background:var(--navy);color:white;padding:12px 16px;border-radius:9px}.toast.show{display:block}.note{padding:12px;background:#eef6f1;color:#39684d;border-radius:9px;font-size:11px;margin-top:16px}
@media(max-width:900px){.shell{grid-template-columns:205px 1fr}.categories{grid-template-columns:repeat(4,1fr)}.tiles,.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.shell{display:block}.side{padding:13px;gap:10px}.nav{grid-template-columns:repeat(2,1fr)}.sidefoot{display:none}.top{padding:0 14px}.content{padding:15px}.hero{grid-template-columns:1fr;padding:20px}.hero h2{font-size:22px}.heroart{height:95px}.actors{grid-template-columns:1fr}.gridproducts{grid-template-columns:1fr 1fr}.head{flex-direction:column}.formgrid{grid-template-columns:1fr}}
</style></head><body>
<div class="shell"><aside class="side"><div class="logo"><div class="mark">I</div><div><b>INBA</b><small>COMERCIALIZACIÓN PRODUCTIVA</small></div></div><div><div class="navlabel">PLATAFORMA</div><nav class="nav"><button class="active" data-page="inicio">⌂ Inicio</button><button data-page="catalogo">▤ Marketplace</button><button data-page="pedidos">▣ Pedidos</button><button data-page="productores">♧ Productores</button><button data-page="compradores">♙ Compradores</button><button data-page="transporte">🚚 Transportistas</button><button data-page="inventario">▦ Inventario</button><button data-page="admin">⚙ Administración</button></nav></div><div class="sidefoot">Imbabura, Ecuador<br>Del campo al mundo, en un solo lugar.</div></aside><main class="main"><header class="top"><span>INBA / <b id="crumb">Inicio</b></span><div style="display:flex;align-items:center;gap:10px"><div class="avatar">MF</div><b style="font-size:12px">Administración INBA</b></div></header><section class="content" id="view"></section></main></div>
<div class="modal" id="modal"><div class="dialog"><h2 id="mtitle">Nuevo registro</h2><div id="mbody"></div><div class="actions"><button class="btn alt" onclick="closeModal()">Cancelar</button><button class="btn" id="msave">Guardar</button></div></div></div><div class="toast" id="toast"></div>
<script>
const cats=[["🥬","Frutas y hortalizas"],["☕","Café y granos"],["🧀","Lácteos"],["🏺","Artesanías"],["🧣","Textiles"],["🍯","Alimentos procesados"],["🌼","Plantas y flores"],["🫙","Otros productos"]];
let products=[["Aguacate Hass","Asociación AgroImbabura","Cotacachi",1.85,420,"🥑","Frutas"],["Tomate riñón","Productores de Chaltura","Antonio Ante",.95,680,"🍅","Hortalizas"],["Mora de Castilla","Finca La Esperanza","Pimampiro",2.2,150,"🫐","Frutas"],["Papa súper chola","Asociación San Pablo","Otavalo",.72,1200,"🥔","Tubérculos"],["Frutilla","Agroproductores del Norte","Ibarra",2.4,95,"🍓","Frutas"],["Maíz suave","Comunidad La Rinconada","San Antonio",.88,530,"🌽","Granos"]];
let orders=[["INB-0018","Supermercado Andino","Aguacate Hass · 120 kg",222,"En preparación"],["INB-0017","Restaurante La Casona","Tomate riñón · 80 kg",76,"En transporte"],["INB-0016","Distribuidora Sierra Norte","Papa · 300 kg",216,"Entregado"]];
let producers=[["Asociación AgroImbabura","Cotacachi",18],["Productores de Chaltura","Antonio Ante",26],["Finca La Esperanza","Pimampiro",4],["Asociación San Pablo","Otavalo",32]];
const labels={inicio:"Inicio",catalogo:"Marketplace",pedidos:"Pedidos",productores:"Productores",compradores:"Compradores",transporte:"Transportistas",inventario:"Inventario",admin:"Administración"};const money=n=>"$"+Number(n).toFixed(2);
function head(k,d,b){return '<div class="head"><div><div class="eyebrow">Plataforma de Comercialización Productiva de Imbabura</div><h1>'+labels[k]+'</h1><div class="sub">'+d+'</div></div>'+(b||'')+'</div>'}
function cards(a){return a.map(p=>'<div class="card product"><div class="art">'+p[5]+'</div><div class="pbody"><h3>'+p[0]+'</h3><p>'+p[1]+' · '+p[2]+'</p><div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px"><span class="price">'+money(p[3])+'<small style="font-size:10px;color:#718096"> / kg</small></span><button class="btn sm" onclick="buy(\''+p[0]+'\')">Comprar</button></div><p>'+p[4]+' kg disponibles</p></div></div>').join('')}
function home(){return head('inicio','Del campo, del taller y del emprendimiento de Imbabura al mundo, en un solo lugar.','<button class="btn alt" onclick="go(\'catalogo\')">Explorar marketplace →</button>')+'<div class="hero"><div><div class="eyebrow" style="color:#b8dfc5">INBA · IMBABURA</div><h2>Productos de Imbabura, conectados con nuevos mercados.</h2><p>Una plataforma para conectar productores, compradores y transportistas de forma segura y transparente.</p><button class="btn" onclick="go(\'catalogo\')">Descubrir productos →</button></div><div class="heroart">🏞️ 🌱</div></div><div class="tiles"><div class="tile"><i>🌱</i><div><b>Productores</b><small>Publican y gestionan su oferta</small></div></div><div class="tile"><i>🛒</i><div><b>Compradores</b><small>Buscan y realizan pedidos</small></div></div><div class="tile"><i>🚚</i><div><b>Transportistas</b><small>Conectan origen y destino</small></div></div><div class="tile"><i>🔒</i><div><b>Plataforma INBA</b><small>Conexión segura y transparente</small></div></div></div><div class="section"><div class="secthead"><h2>Principales productos en la plataforma</h2><button class="btn alt sm" onclick="go(\'catalogo\')">Ver catálogo</button></div><div class="gridproducts">'+cards(products.slice(0,3))+'</div></div><div class="section"><div class="secthead"><h2>Explora por categorías</h2></div><div class="categories">'+cats.map(c=>'<div class="cat" onclick="go(\'catalogo\')"><i>'+c[0]+'</i><b>'+c[1]+'</b></div>').join('')+'</div></div><div class="section"><div class="secthead"><h2>Un ecosistema productivo conectado</h2></div><div class="actors"><div class="actor"><i>🌱</i><div><h3>1. Productores</h3><p>Publican productos, gestionan stock, fijan precios y reciben pedidos.</p><button class="btn alt sm" onclick="go(\'productores\')">Conocer productores</button></div></div><div class="actor"><i>🛒</i><div><h3>2. Compradores</h3><p>Buscan productos, realizan pedidos y coordinan sus compras.</p><button class="btn alt sm" onclick="go(\'catalogo\')">Buscar productos</button></div></div><div class="actor"><i>🚚</i><div><h3>3. Transportistas</h3><p>Recogen en origen, transportan con trazabilidad y entregan al comprador.</p><button class="btn alt sm" onclick="go(\'transporte\')">Ver logística</button></div></div></div></div><div class="note">Prototipo demostrativo: la información y las operaciones son ficticias y no representan transacciones reales.</div>'}
function catalog(){return head('catalogo','Oferta de productores, asociaciones y emprendimientos de Imbabura.','<button class="btn" onclick="newProduct()">＋ Publicar producto</button>')+'<div class="toolbar"><input class="field search" id="q" placeholder="Buscar productos, productores o cantones..." oninput="filter()"><select class="field" id="cat" onchange="filter()"><option value="">Todas las categorías</option>'+cats.map(c=>'<option>'+c[1]+'</option>').join('')+'</select></div><div class="gridproducts" id="products">'+cards(products)+'</div>'}
function table(h,rows){return '<div class="tablewrap"><table><thead><tr>'+h.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
function page(k){if(k==='inicio')return home();if(k==='catalogo')return catalog();if(k==='pedidos')return head(k,'Gestión y seguimiento de pedidos.','<button class="btn" onclick="newOrder()">＋ Registrar pedido</button>')+'<div class="stats">'+[['Pedidos registrados','186'],['Por preparar','23'],['En transporte','14'],['Entregados','149']].map(x=>'<div class="card stat"><small>'+x[0]+'</small><strong>'+x[1]+'</strong></div>').join('')+'</div>'+table(['Pedido','Comprador','Detalle','Total','Estado'],orders.map(o=>[o[0],o[1],o[2],money(o[3]),'<span class="pill">'+o[4]+'</span>']));if(k==='productores')return head(k,'Registro y seguimiento de productores y organizaciones.','<button class="btn" onclick="newProducer()">＋ Registrar productor</button>')+table(['Productor / organización','Cantón','Miembros','Estado'],producers.map(p=>[p[0],p[1],p[2],'<span class="pill">Activo</span>']));if(k==='compradores')return head(k,'Cadenas, supermercados, restaurantes, hoteles y consumidores.')+table(['Comprador','Tipo','Cantón','Estado'],[['Supermercado Andino','Distribuidor','Ibarra','Activo'],['Restaurante La Casona','Restaurante','Otavalo','Activo'],['Hotel Hacienda','Hotel','Cotacachi','Activo']]);if(k==='transporte')return head(k,'Asignación, trazabilidad y confirmación de entregas.')+'<div class="hero"><div><h2>Conectamos los productos con sus destinos.</h2><p>Recogida en origen · Seguimiento de transporte · Entrega al comprador.</p></div><div class="heroart">🚚 🗺️</div></div><div class="tiles"><div class="tile"><i>🚚</i><div><b>14 asignaciones activas</b><small>Operaciones en seguimiento</small></div></div><div class="tile"><i>⌖</i><div><b>5 en tránsito</b><small>Rutas activas</small></div></div><div class="tile"><i>✓</i><div><b>12 entregas hoy</b><small>Datos demostrativos</small></div></div></div>';if(k==='inventario')return head(k,'Existencias y disponibilidad de productos.')+table(['Producto','Productor','Cantón','Stock','Precio'],products.map(p=>[p[0],p[1],p[2],p[4]+' kg',money(p[3])+'/kg']));return head(k,'Administración general del entorno INBA.')+'<div class="card"><h3>Configuración institucional</h3><p>Plataforma de Comercialización Productiva de Imbabura</p><p>Moneda: USD · Territorio: Imbabura, Ecuador</p><span class="pill">Entorno demostrativo</span></div>'}
function go(k){document.getElementById('view').innerHTML=page(k);document.getElementById('crumb').textContent=labels[k];document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===k));window.scrollTo(0,0)}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.page));
function filter(){let q=document.getElementById('q').value.toLowerCase(),c=document.getElementById('cat').value;let a=products.filter(p=>(p[0]+p[1]+p[2]).toLowerCase().includes(q)&&(!c||c===p[6]));document.getElementById('products').innerHTML=a.length?cards(a):'<p>No se encontraron productos.</p>'}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2300)}
function openModal(t,b,save){document.getElementById('mtitle').textContent=t;document.getElementById('mbody').innerHTML=b;document.getElementById('msave').onclick=save;document.getElementById('modal').classList.add('open')}function closeModal(){document.getElementById('modal').classList.remove('open')}
function newProduct(){openModal('Publicar producto','<div class="formgrid"><div class="fg"><label>Producto</label><input id="pn"></div><div class="fg"><label>Productor</label><input id="pp"></div><div class="fg"><label>Cantón</label><input id="pl"></div><div class="fg"><label>Precio USD/kg</label><input id="pr" type="number" step=".01"></div><div class="fg"><label>Stock kg</label><input id="ps" type="number"></div></div>',()=>{let n=document.getElementById('pn').value.trim(),p=Number(document.getElementById('pr').value),s=Number(document.getElementById('ps').value);if(!n||!p||!s){toast('Completa los campos requeridos');return}products.unshift([n,document.getElementById('pp').value||'Productor INBA',document.getElementById('pl').value||'Imbabura',p,s,'🌱','Otros']);closeModal();go('catalogo');toast('Producto agregado al catálogo de demostración')})}
function newProducer(){openModal('Registrar productor','<div class="formgrid"><div class="fg"><label>Nombre / organización</label><input id="pnm"></div><div class="fg"><label>Cantón</label><input id="plc"></div><div class="fg"><label>Número de miembros</label><input id="pm" type="number"></div></div>',()=>{let n=document.getElementById('pnm').value.trim();if(!n){toast('Ingresa el nombre');return}producers.push([n,document.getElementById('plc').value||'Imbabura',document.getElementById('pm').value||1]);closeModal();go('productores');toast('Productor agregado')})}
function newOrder(){openModal('Registrar pedido','<div class="formgrid"><div class="fg"><label>Comprador</label><input id="ob"></div><div class="fg"><label>Detalle</label><input id="od"></div><div class="fg"><label>Total USD</label><input id="ot" type="number"></div></div>',()=>{let b=document.getElementById('ob').value.trim(),t=Number(document.getElementById('ot').value);if(!b||!t){toast('Completa comprador y total');return}orders.unshift(['INB-'+String(orders.length+19).padStart(4,'0'),b,document.getElementById('od').value||'Pedido nuevo',t,'Pendiente de pago']);closeModal();go('pedidos');toast('Pedido registrado')})}
function buy(n){openModal('Solicitar producto','<p>Producto: <b>'+n+'</b></p><div class="fg"><label>Nombre del comprador</label><input id="buyer"></div><div class="fg"><label>Cantidad solicitada (kg)</label><input id="qty" type="number" value="10" min="1"></div>',()=>{let b=document.getElementById('buyer').value.trim(),q=Number(document.getElementById('qty').value);if(!b||!q){toast('Completa los datos');return}orders.unshift(['INB-'+String(orders.length+19).padStart(4,'0'),b,n+' · '+q+' kg',0,'Pendiente de confirmación']);closeModal();toast('Solicitud registrada en esta demostración')})}
go('inicio');
</script></body></html>
